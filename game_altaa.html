<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدي الأبطال: عائلة التاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a cheerful classroom game board, calm colours, big targets for the interactive whiteboard
   IDEA: a family of three letter characters hosting a team quiz
   PICTURE: the word card with its picture fills the centre; the three letters are the buttons
   COLOUR and TYPE: white ground, navy ink, teal (ت) coral (ة) amber (ه); Tajawal UI + Noto Naskh for words
   LAYOUT: tabs on top, team scores row, big card, three answer buttons */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#13243a);--ink:light-dark(#1F3A5F,#eef3f9);--soft:light-dark(#F3F6FA,#1c3150);--line:light-dark(#dfe6ef,#2b4466);
--t:#2A9D8F;--ta:#E76F51;--h:#E9A23B;--ok:#2E9E5B;--bad:#D62828}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Tajawal,Dubai,"Segoe UI",Tahoma,sans-serif;overflow-x:clip}
.wrap{max-width:1180px;margin:auto;padding:14px max(3vw,12px) 28px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
h1{font-size:clamp(24px,3.2vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.fam{display:flex;gap:4px}.fam img{height:58px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 18px;min-height:46px;cursor:pointer;background:var(--soft);color:var(--ink)}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--h);outline-offset:2px}
.view{display:none;margin-top:14px}.view.on{display:block}
.teams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.team{background:var(--soft);border-radius:16px;padding:8px 10px;text-align:center;border:3px solid transparent;transition:.25s}
.team.turn{border-color:var(--ink);transform:translateY(-3px)}
.team b{display:block;font-size:16px}.team span{font-size:30px;font-weight:800}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-top:16px;align-items:stretch}
.card{background:var(--bg);border:2px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.06);position:relative;min-height:330px}
.card img.p{width:clamp(120px,16vw,170px);height:auto}
.word{font-family:"Noto Naskh Arabic",serif;font-weight:700;font-size:clamp(52px,7vw,84px);line-height:1.25}
.word .end{display:inline-block;min-width:.9em;border-bottom:5px dashed var(--line);text-align:center}
.say{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ans{display:grid;gap:12px}
.ans button{font:800 clamp(44px,6vw,64px)/1 "Noto Naskh Arabic",serif;color:#fff;border:0;border-radius:22px;min-height:96px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.ans button small{font:700 20px Tajawal,sans-serif}
.ans button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.a-t{background:var(--t)}.a-ta{background:var(--ta)}.a-h{background:var(--h)}
.ans button:disabled{opacity:.45;cursor:default}
.msg{min-height:34px;font-size:20px;font-weight:800;text-align:center}
.timer{position:absolute;top:12px;inset-inline-start:14px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:conic-gradient(var(--ta) var(--p,100%),var(--soft) 0)}
.timer i{position:absolute;inset:6px;border-radius:50%;background:var(--bg)}.timer em{position:relative;font-style:normal}
.count{position:absolute;top:16px;inset-inline-end:18px;font-weight:700;opacity:.7}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.win{text-align:center;padding:30px 10px}.win h2{font-size:clamp(30px,4vw,48px);margin:.2em 0}
.mic{display:grid;place-items:center;gap:14px;text-align:center;padding:10px}
.micbtn{width:170px;height:170px;border-radius:50%;border:0;background:var(--ta);cursor:pointer;box-shadow:0 8px 0 #c2543a;display:grid;place-items:center}
.micbtn img{width:110px}.micbtn.live{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.heard{font-family:"Noto Naskh Arabic",serif;font-size:clamp(48px,7vw,80px);font-weight:700;min-height:1.4em}
.note{font-size:15px;opacity:.75;max-width:640px}
.big{font-size:clamp(90px,16vw,170px);font-weight:800;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;width:12px;height:18px;top:-20px;border-radius:3px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.conf{display:none}.micbtn.live{animation:none}}
@media(max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}.teams{grid-template-columns:repeat(3,minmax(0,1fr))}.ans{grid-template-columns:repeat(3,minmax(0,1fr))}.ans button small{display:none}}
</style>
</head>

  $('pic').src = IMG[q[0]]; $('pic').alt = q[3];
  $('word').innerHTML = `${q[1]}<span class="end">؟</span>`;
  $('cnt').textContent = (i+1)+' / '+deck.length;
  $('msg').textContent = 'دَوْرُ مَجْموعَةِ ' + TEAMS[turn][1] + ' ' + TEAMS[turn][0];
  document.querySelectorAll('.ans button').forEach(b=>b.disabled=false);
  $('next').disabled = true; drawTeams(); startTimer();
}
function answer(a){
  const q = deck[i]; clearInterval(tick);
  document.querySelectorAll('.ans button').forEach(b=>b.disabled=true);
  $('word').innerHTML = q[1].replace('ـ','') + `<span style="color:${COL[q[2]]}">${q[2]}</span>`;
  if(a===q[2]){ score[turn]++; tone([523,659,784]); confetti(); $('msg').innerHTML = '<span style="color:var(--ok)">أَحْسَنْتُمْ! +1 ⭐</span>'; }
  else { tone([220,180],.2); $('msg').innerHTML = `<span style="color:var(--bad)">${a?'حاوِلوا مَرَّةً أُخْرى في الجَوْلَةِ القادِمَةِ':'انْتَهى الوَقْتُ'}</span> — قِفْ: ${q[3]} ← صِلْ: ${q[4]}`; }
  play(BANK.indexOf(q),1,q[4]); $('next').disabled = false; drawTeams();
}
function next(){ i++; turn = (turn+1)%TEAMS.length; if(i>=deck.length) return finish(); load(); }
function finish(){
  done = true; clearInterval(tick); drawTeams(); $('play').hidden = true;
  const best = Math.max(...score), win = TEAMS.filter((t,k)=>score[k]===best).map(t=>t[0]+' '+t[1]).join(' و ');
  $('win').hidden = false; $('win').innerHTML = `<img src="${IMG.trophy}" alt="" width="140"><h2>الفائِزُ: ${win}</h2><p>كُلُّكُمْ أَبْطالُ عائِلَةِ التّاءِ 👏</p><button class="btn" id="again">↺ جَوْلَةٌ جَديدَةٌ</button>`;
  $('again').addEventListener('click', start); tone([523,659,784,1046]); confetti();
}
function start(){ deck = shuffle(BANK.slice()).slice(0,10); i = 0; turn = 0; score = [0,0,0,0,0]; done = false; $('win').hidden = true; $('play').hidden = false; load(); }
document.querySelectorAll('.ans button').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.a)));
$('next').addEventListener('click', next);
$('restart').addEventListener('click', start);
$('sayJoin').addEventListener('click',()=>play(BANK.indexOf(deck[i]),1,deck[i][4]));
start();

/* magic mic */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, live = false;
$('micbtn').addEventListener('click',()=>{
  if(!SR){ $('micstate').textContent = 'هذا المتصفح لا يدعم التعرف على الكلام. افتح الملف في Chrome أو Edge.'; return; }
  if(live){ try{rec.stop()}catch(e){} return; }
  rec = new SR(); rec.lang = 'ar-AE'; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onstart = ()=>{ live = true; $('micbtn').classList.add('live'); $('micstate').textContent = 'أَسْتَمِعُ إلَيْكَ... 👂'; $('heard').textContent=''; $('micq').textContent=''; };
  rec.onresult = e=>{ let t=''; for(const r of e.results) t += r[0].transcript; $('heard').textContent = t; };
  rec.onerror = e=>{ $('micstate').textContent = e.error==='not-allowed' ? 'لم يُسمح باستخدام الميكروفون هنا. افتح الملف المحلي في Chrome أو Edge واسمح بالميكروفون.' : 'لم أسمع جيدًا، حاول مرة أخرى.'; };
  rec.onend = ()=>{ live = false; $('micbtn').classList.remove('live'); if($('heard').textContent){ $('micstate').textContent = 'هذا ما كَتَبَهُ الذَّكاءُ الاصْطِناعِيُّ:'; $('micq').textContent = 'هَلْ كَتَبَها صَحيحَةً؟ وَبِماذا انْتَهَتْ: ت أَمْ ة أَمْ ه؟ 🤔'; tone([659,784]); } };
  try{ rec.start(); }catch(e){ $('micstate').textContent = 'تعذّر تشغيل الميكروفون.'; }
});

/* timer */
let tsec = 240, tleft = 240, tt = null;
function tdraw(){ $('clock').textContent = Math.floor(tleft/60)+':'+String(tleft%60).padStart(2,'0'); $('clock').style.color = tleft<=30 ? 'var(--ta)' : ''; }
$('presets').innerHTML = [1,2,3,4,6].map(m=>`<button class="btn" data-m="${m}">${m} د</button>`).join('');
$('presets').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ clearInterval(tt); tsec = tleft = b.dataset.m*60; tdraw(); }));
$('tgo').addEventListener('click',()=>{ clearInterval(tt); tt = setInterval(()=>{ tleft--; tdraw(); if(tleft<=0){ clearInterval(tt); tone([784,659,523,784,1046],.18); confetti(); } },1000); });
$('tpause').addEventListener('click',()=>clearInterval(tt));
tdraw();
}
</script>
</body>
</html>
